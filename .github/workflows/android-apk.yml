name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug
      - name: Prepare artifact
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nueva-version.apk
          sha256sum nueva-version.apk > nueva-version.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nueva-version.apk
          path: |
            nueva-version.apk
            nueva-version.apk.sha256
